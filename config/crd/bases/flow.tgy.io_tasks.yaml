---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: tasks.flow.tgy.io
spec:
  group: flow.tgy.io
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.flow
      name: Flow
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.runID
      name: Run
      type: integer
    - jsonPath: .status.reworkBudget
      name: Budget
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Task is one execution of a flow.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TaskSpec is the whole instance. Four fields, three of them optional: whoever
              creates a task — a cron, an event, an agent — does not have to know the
              graph, and the graph can change without them changing.

              The spec is immutable after creation. Editing what a running task was asked
              to do would leave its history describing a question nobody asked.
            properties:
              dedupKey:
                description: |-
                  DedupKey suppresses creation while another task with the same key is
                  still running. Useful when the producer is an event source that may
                  deliver twice.
                type: string
              flow:
                description: |-
                  Flow is resolved in this namespace, always. There is no field naming
                  another namespace, so "which flows may I start" collapses into "which
                  namespaces may I create a Task in" — which plain RBAC can express, and
                  field values cannot.
                minLength: 1
                type: string
              input:
                description: |-
                  Input is written to in/input.json and exposed to prompts as template
                  variables. Its shape is the flow author's business; the controller only
                  carries it.
                x-kubernetes-preserve-unknown-fields: true
            required:
            - flow
            type: object
          status:
            description: |-
              TaskStatus holds control state only. Logs, reports and results are
              references — etcd has been lost twice here, and a design that puts payloads
              in it turns that from an outage into data loss.
            properties:
              artifacts:
                properties:
                  store:
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentRun:
                description: |-
                  RunRef identifies one execution of one phase. runID separates the second
                  visit to a phase from the first, so a rework does not read what the previous
                  attempt left behind.
                properties:
                  deadline:
                    format: date-time
                    type: string
                  infraRetries:
                    description: |-
                      InfraRetries counts attempts lost to something other than the handler's
                      judgement. It is not in the design's status example, but maxInfraRetries
                      cannot be enforced without somewhere to count.
                    format: int32
                    type: integer
                  jobName:
                    description: |-
                      JobName is derived deterministically from the task, phase and runID, so
                      a controller restart re-creates the same object instead of a second one.
                    type: string
                  phase:
                    description: |-
                      Phase is a status name. It is a free string chosen by whoever writes the
                      flow: this framework does not know what the work is, so it has no business
                      naming its stages. "調査" and "Planning" are equally valid.

                      Two names are reserved, because they are the framework's own answers rather
                      than anything in the author's domain — see ReservedPhases.
                    type: string
                  runID:
                    format: int32
                    type: integer
                required:
                - phase
                - runID
                type: object
              expiresAt:
                description: |-
                  ExpiresAt is when the controller deletes this task, set once it stops.
                  The moment is fixed here rather than derived from the flow's ttl each
                  time, so a task at Escalated keeps its date even after the flow that
                  set it is edited or gone — the same reason the reserved phases need no
                  flow to be terminal.
                format: date-time
                type: string
              history:
                items:
                  description: |-
                    HistoryEntry records a completed run. This is the audit trail; the artifacts
                    it points at live in object storage, never in etcd.
                  properties:
                    directory:
                      description: |-
                        Directory the handler wrote into, empty when the run produced no single
                        answer.
                      type: string
                    finishedAt:
                      format: date-time
                      type: string
                    outcome:
                      description: |-
                        Outcome is why the task moved: the framework's account of the run,
                        recorded even when the handler said nothing.
                      type: string
                    phase:
                      description: |-
                        Phase is a status name. It is a free string chosen by whoever writes the
                        flow: this framework does not know what the work is, so it has no business
                        naming its stages. "調査" and "Planning" are equally valid.

                        Two names are reserved, because they are the framework's own answers rather
                        than anything in the author's domain — see ReservedPhases.
                      type: string
                    reason:
                      description: |-
                        Reason is the one line a human reads next to Outcome: which edge was
                        followed, or why no answer counted, or what the handler said after
                        naming its directory. The transition never reads it.
                      maxLength: 2048
                      type: string
                    ref:
                      description: Ref points at the run's output in the store.
                      type: string
                    runID:
                      format: int32
                      type: integer
                  required:
                  - outcome
                  - phase
                  - runID
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              phase:
                description: |-
                  Phase is a status name. It is a free string chosen by whoever writes the
                  flow: this framework does not know what the work is, so it has no business
                  naming its stages. "調査" and "Planning" are equally valid.

                  Two names are reserved, because they are the framework's own answers rather
                  than anything in the author's domain — see ReservedPhases.
                type: string
              reworkBudget:
                description: |-
                  ReworkBudget remaining. Counted down by the controller as reworks are
                  taken, never declared by the flow.
                format: int32
                type: integer
              runID:
                description: RunID of the current or last run.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
