---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-flow-tgy-io-v1alpha1-taskflow
  failurePolicy: Fail
  name: vtaskflow-v1alpha1.kb.io
  rules:
  - apiGroups:
    - flow.tgy.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - taskflows
  sideEffects: None
